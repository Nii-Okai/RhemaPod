[project]
name = "fastapi-sermon"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.18.5",
    "asyncpg>=0.32.0",
    "boto3>=1.43.63",
    "fastapi[standard]>=0.141.1",
    "psycopg[binary]>=3.3.4",
    "pwdlib[argon2]>=0.2.1",
    "pydantic-settings>=2.14.2",
    "pyjwt[crypto]>=2.15.1",
    "redis>=8.0.1",
    "sqlalchemy>=2.0.51",
    "structlog>=26.1.0",
]

[dependency-groups]
dev = [
    "aiosqlite>=0.20",
    "httpx>=0.27",
    "pytest>=9.1.1",
    "pytest-asyncio>=0.24",
    "testcontainers[postgres]>=4.15.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
# admin_portal/ is a separate Node/TypeScript project — keep Python tooling out.
extend-exclude = ["admin_portal"]

[tool.ruff.lint.per-file-ignores]
# Comments suites import their pytest fixtures from tests/comments_pg.py (Isaac's
# ruling); using a fixture as a test parameter then looks like a redefinition.
"tests/comments_pg.py" = ["F811"]
"tests/test_admin_comments.py" = ["F811"]
"tests/test_comment_moderation.py" = ["F811"]
"tests/test_comment_query_plans.py" = ["F811"]
"tests/test_comments.py" = ["F811"]
"tests/test_comments_pg_fixtures.py" = ["F811"]
"tests/test_migrations_comments.py" = ["F811"]
"tests/test_purge_comment_snapshots.py" = ["F811"]
# Same reason: tests/test_oauth.py imports its Postgres fixtures from
# tests/comments_pg.py (ADR 0015 — Testcontainers Postgres for OAuth's
# integration coverage).
"tests/test_oauth.py" = ["F811"]
