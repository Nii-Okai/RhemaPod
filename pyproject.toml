[project]
name = "fastapi-sermon"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.18.5",
    "boto3>=1.43.63",
    "fastapi[standard]>=0.141.1",
    "psycopg[binary]>=3.3.4",
    "pwdlib[argon2]>=0.2.1",
    "pydantic-settings>=2.14.2",
    "pyjwt[crypto]>=2.10.1",
    "redis>=8.0.1",
    "sqlalchemy>=2.0.51",
    "stripe>=15.4.0",
    "structlog>=26.1.0",
]

[dependency-groups]
dev = [
    "aiosqlite>=0.20",
    "httpx>=0.27",
    "pytest>=9.1.1",
    "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
# admin_portal/ is a separate Node/TypeScript project — keep Python tooling out.
extend-exclude = ["admin_portal"]
