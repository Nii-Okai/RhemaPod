name: fastapi-sermon

# Local dev / integration stack: api + postgres + redis + minio.
# MinIO backs the browser-direct presigned-upload pipeline (the in-process
# LocalStorage stub fakes both the URL and the object, so it cannot exercise it)
# — see ADR 0001 §4, superseded 2026-09 (W8). Stripe is still the in-process
# MockProvider.
#
# Migrations are NOT run on `up`. Run them once, as an explicit operator step:
#     docker compose run --rm migrate
#   (equivalently: docker compose run --rm api alembic upgrade head)
# The `migrate` service sits behind a profile so it is never started by `up`.

# Shared app config for the api and migrate containers. DATABASE_URL and
# REDIS_URL default to the compose-network services. SECRET_KEY has NO default —
# supply it before `up` (export it, or `cp .env.docker.example .env` and fill it
# in; compose auto-loads .env for ${VAR} substitution). `docker compose up`
# fails loudly until it is set. Everything here is DEV-ONLY, not a real secret.
x-app-env: &app-env
  ENVIRONMENT: development
  # Required, no default. app/core/config.py rejects placeholder / low-entropy
  # keys in every environment, so this must be real random bytes even in dev:
  #     python -c "import secrets; print(secrets.token_urlsafe(48))"
  SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required — cp .env.docker.example .env and generate one}
  DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://sermon:sermon@postgres:5432/sermon}
  REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
  # Object storage — the compose MinIO. Setting the access keys flips
  # settings.storage_is_live true, so get_storage() returns the real S3Storage
  # and the browser-direct presigned PUT is exercised end to end. The API
  # container reaches MinIO at minio:9000; the browser's presigned URLs are
  # signed for S3_PUBLIC_ENDPOINT so it can PUT to a host it can resolve
  # (SigV4 signs Host, so the signing host must match). DEV-ONLY credentials.
  S3_ENDPOINT_URL: http://minio:9000
  S3_PUBLIC_ENDPOINT: http://localhost:9000
  S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
  S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
  S3_RAW_BUCKET: sermon-raw
  S3_MEDIA_BUCKET: sermon-media

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: sermon
      POSTGRES_PASSWORD: sermon
      POSTGRES_DB: sermon
    ports:
      # Bind to loopback only — do not publish the DB on every host interface.
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sermon -d sermon"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8
    ports:
      # Bind to loopback only — do not publish Redis on every host interface.
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # S3-compatible object storage for the media upload pipeline. Console on 9001.
  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      # Browser uploads PUT cross-origin from the portal's dev origin. MinIO's
      # server-wide CORS allow-list is the clean, version-stable way to permit
      # it (per-bucket `mc cors` support varies by mc release).
      MINIO_API_CORS_ALLOW_ORIGIN: ${PORTAL_ORIGIN:-http://localhost:3000}
    ports:
      # Loopback only. 9000 = S3 API (matches S3_PUBLIC_ENDPOINT), 9001 = console.
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/minio/health/live || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

  # One-shot: create the raw + media buckets, then exit. Idempotent.
  createbuckets:
    image: minio/mc
    depends_on:
      minio:
        condition: service_started
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    entrypoint:
      - /bin/sh
      - -c
      - >
        until mc alias set local http://minio:9000
        "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"; do
          echo 'waiting for minio...'; sleep 1;
        done;
        mc mb --ignore-existing local/sermon-raw;
        mc mb --ignore-existing local/sermon-media;
        echo 'buckets ready';

  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      <<: *app-env
      DEBUG: "true"
      UVICORN_WORKERS: ${UVICORN_WORKERS:-1}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      createbuckets:
        condition: service_completed_successfully
    healthcheck:
      # Mirrors the image HEALTHCHECK (liveness — checks nothing external).
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health/live', timeout=4).status == 200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # One-shot migration runner. Started ONLY via its profile, never by `up`:
  #     docker compose run --rm migrate
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    profiles: ["migrate"]
    command: ["alembic", "upgrade", "head"]
    environment:
      <<: *app-env
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
  minio-data:
