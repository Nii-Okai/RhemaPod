name: fastapi-sermon

# Local dev / integration stack: api + postgres + redis.
# Live object storage is a real Cloudflare R2 bucket (decision L3 — MinIO is
# no longer good enough: it can't reproduce Stream pulling from a
# localhost-only URL, which is the bug that motivated the R2 migration in
# the first place; see ADR 0001 §4, superseded 2026-09, and plan
# plans/plan-r2-storage.md). Credentials are per-developer and never live in
# this file — see docker-compose.override.yml (gitignored).
#
# The `minio-data` volume below is intentionally still declared even though
# no service uses it: it holds the pre-cutover dev media the R2 migration's
# one-time copy step (plan R3.3) still needs to read, through a temporary
# MinIO container. Do not run `docker compose down -v` before that step is
# logged in status.md (plan P5) — it would delete that volume's data.
#
# Migrations are NOT run on `up`. Run them once, as an explicit operator step:
#     docker compose run --rm migrate
#   (equivalently: docker compose run --rm api alembic upgrade head)
# The `migrate` service sits behind a profile so it is never started by `up`.

# Shared app config for the api and migrate containers. DATABASE_URL and
# REDIS_URL default to the compose-network services. SECRET_KEY has NO default —
# supply it before `up` (export it, or `cp .env.docker.example .env` and fill it
# in; compose auto-loads .env for ${VAR} substitution). `docker compose up`
# fails loudly until it is set. Everything here is DEV-ONLY, not a real secret.
#
# Object storage credentials (OBJECT_STORE_*/ARCHIVE_STORE_*) are
# deliberately NOT here: they come from docker-compose.override.yml
# (gitignored), added per service (api, sweeps, archive-sweep) once R2/AWS
# are provisioned (plan R2.1/R2.3) — see that file's own header comment.
x-app-env: &app-env
  ENVIRONMENT: development
  # Required, no default. app/core/config.py rejects placeholder / low-entropy
  # keys in every environment, so this must be real random bytes even in dev:
  #     python -c "import secrets; print(secrets.token_urlsafe(48))"
  SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required — cp .env.docker.example .env and generate one}
  DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://sermon:sermon@postgres:5432/sermon}
  REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: sermon
      POSTGRES_PASSWORD: sermon
      POSTGRES_DB: sermon
    ports:
      # Bind to loopback only — do not publish the DB on every host interface.
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sermon -d sermon"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8
    ports:
      # Bind to loopback only — do not publish Redis on every host interface.
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      <<: *app-env
      DEBUG: "true"
      RETENTION_SCHEDULER_ENABLED: "true"
      UVICORN_WORKERS: ${UVICORN_WORKERS:-1}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # Mirrors the image HEALTHCHECK (liveness — checks nothing external).
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health/live', timeout=4).status == 200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # Scheduled maintenance jobs (stale-upload sweep + subscription expiry).
  # Profile-gated, so `docker compose up` does NOT start it — opt in with:
  #     docker compose --profile sweeps up -d sweeps
  # This is the DEV / self-host answer only. A deployed environment MUST run
  # these on a real scheduler (ECS scheduled task, k8s CronJob, cron) with
  # failure alerting and a concurrency lock — see DEPLOYMENT.md §5. Do not
  # grow this into a job runner.
  sweeps:
    build:
      context: .
      dockerfile: Dockerfile
    profiles: ["sweeps"]
    environment:
      <<: *app-env
    command:
      - /bin/sh
      - -c
      - >
        while true; do
          python -m app.scripts.sweep_uploads || true;
          python -m app.scripts.sweep_stream_jobs || true;
          python -m app.scripts.expire_subscriptions || true;
          sleep 3600;
        done
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # One-shot comment-snapshot purge (sermon comments). Started ONLY via its
  # own `ops` profile, never by `up` and never by any other service's profile:
  #     docker compose --profile ops run --rm comment-snapshot-purge
  # Nulls moderation-log body snapshots older than 90 days. Schedule it daily
  # on a real scheduler in deployed environments, same as the periodic jobs above.
  # Also runs in-process (with the audit ip/UA purge) when the api service has
  # RETENTION_SCHEDULER_ENABLED=true; both are idempotent and advisory-lock guarded.
  comment-snapshot-purge:
    build:
      context: .
      dockerfile: Dockerfile
    profiles: ["ops"]
    environment:
      <<: *app-env
    command: ["python", "-m", "app.scripts.purge_comment_snapshots"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  # One-shot archive sweep (R2 storage). Started ONLY via its own `ops`
  # profile, never by `up` and never by any other service's profile:
  #     docker compose --profile ops run --rm archive-sweep
  # app/scripts/sweep_archives.py is added in R1.9; this stub exists only so
  # `docker compose config` resolves the override's archive-sweep service.
  archive-sweep:
    build:
      context: .
      dockerfile: Dockerfile
    profiles: ["ops"]
    environment:
      <<: *app-env
    command: ["python", "-m", "app.scripts.sweep_archives"]
    restart: "no"

  # One-shot migration runner. Started ONLY via its profile, never by `up`:
  #     docker compose run --rm migrate
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    profiles: ["migrate"]
    command: ["alembic", "upgrade", "head"]
    environment:
      <<: *app-env
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
  minio-data:
