# Render Blueprint — RhemaPod STAGING (DEPLOYMENT-RENDER.md is the runbook).
#
# Secrets never live here. Values marked `sync: false` are prompted for in the
# Render dashboard on first Blueprint sync; see .env.render.example for the list.
# `region` is immutable after creation — change it before the first sync.

envVarGroups:
  # Non-secret config shared by the API and every cron job. Env groups can't
  # hold `sync: false` values or reference the database, so secrets and
  # connection strings are attached per service below.
  - name: rhemapod-staging
    envVars:
      - key: ENVIRONMENT
        value: staging
      - key: DEBUG
        value: "false"
      - key: LOG_LEVEL
        value: INFO
      - key: SECRET_KEY
        generateValue: true
      - key: FRONTEND_BASE_URL
        value: https://admin.rhemapod.com
      - key: ALLOWED_ORIGINS
        value: '["https://admin.rhemapod.com"]'
      # Render's proxies reach the container from its private 10.0.0.0/8
      # network. Verify with the audit-log check in DEPLOYMENT-RENDER.md §6
      # before trusting per-IP rate limits.
      - key: TRUSTED_PROXIES
        value: '["10.0.0.0/8"]'
      - key: REQUIRE_EMAIL_VERIFICATION
        value: "true"
      - key: OAUTH_GOOGLE_ENABLED
        value: "true"
      - key: GOOGLE_OAUTH_CLIENT_IDS
        value: 827558560538-it16fls8iu36e9c3fcp13beaf9u54ooe.apps.googleusercontent.com,827558560538-ujevidt1217i6a2gu8fm9sn8je755kta.apps.googleusercontent.com,827558560538-jfpd1k7eq6bej6q481ohb2co70t56h9r.apps.googleusercontent.com
      - key: OAUTH_APPLE_ENABLED
        value: "true"
      - key: OBJECT_STORE_RAW_BUCKET
        value: sermon-raw-staging
      - key: OBJECT_STORE_MEDIA_BUCKET
        value: sermon-media-staging
      - key: SMTP_HOST
        value: smtp.resend.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USERNAME
        value: resend
      - key: SMTP_FROM_EMAIL
        value: RhemaPod <no-reply@rhemapod.com>
      - key: SMTP_USE_TLS
        value: "true"
      - key: DB_POOL_SIZE
        value: "5"
      - key: DB_MAX_OVERFLOW
        value: "5"

databases:
  - name: rhemapod-staging-db
    databaseName: rhemapod
    plan: 0.1c-256mb
    postgresMajorVersion: "17"
    region: frankfurt
    ipAllowList: []          # private network only

services:
  - type: keyvalue
    name: rhemapod-staging-kv
    plan: 256mb              # free has no persistence: every restart would log everyone out
    region: frankfurt
    maxmemoryPolicy: noeviction   # refresh sessions live here; never evict them
    persistenceMode: journal-snapshot
    ipAllowList: []          # private network only

  - type: web
    name: rhemapod-api-staging
    runtime: docker
    plan: 0.5c-512mb
    region: frankfurt
    branch: dev
    autoDeployTrigger: commit
    dockerfilePath: ./Dockerfile
    dockerContext: .
    # Migrations + preflight run once per deploy, before any instance starts.
    preDeployCommand: alembic upgrade head && python -m app.scripts.preflight
    healthCheckPath: /health/live
    domains:
      - api.rhemapod.com
    envVars:
      - fromGroup: rhemapod-staging
      - key: PORT
        value: "8000"
      - key: DATABASE_URL
        fromDatabase:
          name: rhemapod-staging-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: rhemapod-staging-kv
          property: connectionString
      - key: OBJECT_STORE_ENDPOINT_URL
        sync: false
      - key: OBJECT_STORE_ACCESS_KEY_ID
        sync: false
      - key: OBJECT_STORE_SECRET_ACCESS_KEY
        sync: false
      - key: SMTP_PASSWORD
        sync: false

  - type: web
    name: rhemapod-admin-staging
    runtime: node
    plan: 0.5c-512mb
    region: frankfurt
    branch: dev
    autoDeployTrigger: commit
    rootDir: admin_portal
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    domains:
      - admin.rhemapod.com
    envVars:
      - key: NODE_VERSION
        value: "24"
      # Server-to-server over Render's private network; the browser never
      # calls the API directly. Confirm the internal address in the API
      # service's Connect panel (DEPLOYMENT-RENDER.md §4).
      - key: API_BASE_URL
        value: http://rhemapod-api-staging:8000
      - key: PORTAL_ORIGIN
        value: https://admin.rhemapod.com

  # Scheduled jobs (DEPLOYMENT.md §5). They need only the shared config plus
  # the database; Stream is a stub on staging, so sweep_stream_jobs is a no-op.
  - type: cron
    name: rhemapod-staging-hourly
    runtime: docker
    plan: 0.5c-512mb
    region: frankfurt
    branch: dev
    schedule: "7 * * * *"
    dockerfilePath: ./Dockerfile
    dockerContext: .
    # Every job runs even if an earlier one fails; the run still exits non-zero
    # so Render flags it.
    dockerCommand: sh -c "rc=0; for j in expire_subscriptions sweep_uploads sweep_stream_jobs; do python -m app.scripts.$j || rc=1; done; exit $rc"
    envVars:
      - fromGroup: rhemapod-staging
      - key: DATABASE_URL
        fromDatabase:
          name: rhemapod-staging-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: rhemapod-staging-kv
          property: connectionString

  - type: cron
    name: rhemapod-staging-daily
    runtime: docker
    plan: 0.5c-512mb
    region: frankfurt
    branch: dev
    schedule: "23 3 * * *"
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: sh -c "rc=0; for j in purge_audit_log purge_comment_snapshots; do python -m app.scripts.$j || rc=1; done; exit $rc"
    envVars:
      - fromGroup: rhemapod-staging
      - key: DATABASE_URL
        fromDatabase:
          name: rhemapod-staging-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: rhemapod-staging-kv
          property: connectionString
